<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Authentic Aurora Gradient: Periwinkle Blue -> Sky Blue -> Aurora Turquoise -> Pastel Mint Green -->
    <linearGradient id="waRibbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93A4EB" />
      <stop offset="32%" stop-color="#72BCE7" />
      <stop offset="66%" stop-color="#5CCFBE" />
      <stop offset="100%" stop-color="#4FD37C" />
    </linearGradient>

    <!-- Fine pleated vertical pinstripe texture from official logo -->
    <pattern id="waPinstripes" width="4.5" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#003540" stroke-width="0.75" stroke-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Ice Blue Background Card (exact hex #B8E2E8 from uploaded image) -->
  <rect width="540" height="600" rx="36" fill="#B8E2E8" />

  <!-- Monogram WA: Classic Black Serif Letters with Interlocking Ligature -->
  <text 
    x="270" 
    y="350" 
    text-anchor="middle" 
    font-family="'Playfair Display', Georgia, 'Didot', 'Times New Roman', serif" 
    font-weight="900" 
    font-size="305" 
    fill="#000000" 
    letter-spacing="-31px"
  >WA</text>

  <!-- Flowing Wave Banner Ribbon -->
  <g>
    <!-- Base ribbon with smooth 4-color aurora gradient -->
    <path 
      d="M 54,444 C 145,416 290,402 410,390 C 455,385 475,374 484,364 L 484,462 C 475,474 455,485 410,490 C 290,502 145,516 54,528 Z" 
      fill="url(#waRibbonGradient)" 
    />

    <!-- Vertical pinstripe texture overlay -->
    <path 
      d="M 54,444 C 145,416 290,402 410,390 C 455,385 475,374 484,364 L 484,462 C 475,474 455,485 410,490 C 290,502 145,516 54,528 Z" 
      fill="url(#waPinstripes)" 
    />

    <!-- Lower-left 4-pointed sparkle star -->
    <path 
      d="M 98,495 Q 98,503 90,503 Q 98,503 98,511 Q 98,503 106,503 Q 98,503 98,495 Z" 
      fill="#FFFFFF" 
      opacity="0.95" 
    />

    <!-- Upper-right 4-pointed sparkle star -->
    <path 
      d="M 462,382 Q 462,388 456,388 Q 462,388 462,394 Q 462,388 468,388 Q 462,388 462,382 Z" 
      fill="#FFFFFF" 
      opacity="0.95" 
    />

    <!-- Typography: "Winter Attire" on the Ribbon (as-is from the image) -->
    <g transform="rotate(-2.2 270 455)">
      <text 
        x="270" 
        y="464" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="44" 
        fill="#000000" 
        letter-spacing="-0.5px"
      >Winter Attire</text>
    </g>
  </g>
</svg>
