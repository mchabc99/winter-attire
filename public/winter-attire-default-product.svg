<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Authentic Aurora Ribbon Gradient -->
    <linearGradient id="waRibbonGradientDefault" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93A4EB" />
      <stop offset="32%" stop-color="#72BCE7" />
      <stop offset="66%" stop-color="#5CCFBE" />
      <stop offset="100%" stop-color="#4FD37C" />
    </linearGradient>

    <!-- Pinstripes pattern -->
    <pattern id="waPinstripesDefault" width="4.5" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#003540" stroke-width="0.75" stroke-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Background with required #C2E6ED fill -->
  <rect width="600" height="600" fill="#C2E6ED" />

  <!-- Subtle inner border for card polish -->
  <rect x="16" y="16" width="568" height="568" rx="28" fill="none" stroke="#0C3B43" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Centered WA Logo Group scaled to fit 600x600 -->
  <g transform="translate(30, 15) scale(0.9)">
    <!-- Monogram WA: Classic Black Serif Letters with Interlocking Ligature -->
    <text 
      x="300" 
      y="320" 
      text-anchor="middle" 
      font-family="'Playfair Display', Georgia, 'Didot', 'Times New Roman', serif" 
      font-weight="900" 
      font-size="270" 
      fill="#000000" 
      letter-spacing="-26px"
    >WA</text>

    <!-- Flowing Wave Banner Ribbon -->
    <g>
      <!-- Base ribbon with smooth 4-color aurora gradient -->
      <path 
        d="M 70,410 C 160,385 290,372 410,360 C 455,355 475,345 484,335 L 484,432 C 475,444 455,455 410,460 C 290,472 160,485 70,496 Z" 
        fill="url(#waRibbonGradientDefault)" 
      />

      <!-- Vertical pinstripe texture overlay -->
      <path 
        d="M 70,410 C 160,385 290,372 410,360 C 455,355 475,345 484,335 L 484,432 C 475,444 455,455 410,460 C 290,472 160,485 70,496 Z" 
        fill="url(#waPinstripesDefault)" 
      />

      <!-- Lower-left 4-pointed sparkle star -->
      <path 
        d="M 112,462 Q 112,470 104,470 Q 112,470 112,478 Q 112,470 120,470 Q 112,470 112,462 Z" 
        fill="#FFFFFF" 
        opacity="0.95" 
      />

      <!-- Upper-right 4-pointed sparkle star -->
      <path 
        d="M 462,352 Q 462,358 456,358 Q 462,358 462,364 Q 462,358 468,358 Q 462,358 462,352 Z" 
        fill="#FFFFFF" 
        opacity="0.95" 
      />

      <!-- Typography: "Winter Attire" on the Ribbon -->
      <g transform="rotate(-2.2 300 425)">
        <text 
          x="300" 
          y="432" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="40" 
          fill="#000000" 
          letter-spacing="-0.5px"
        >Winter Attire</text>
      </g>
    </g>

    <!-- Subtitle underneath -->
    <text 
      x="300" 
      y="545" 
      text-anchor="middle" 
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-weight="700" 
      font-size="16" 
      fill="#0C3B43" 
      letter-spacing="2px"
      opacity="0.8"
    >OFFICIAL CATALOG ITEM</text>
  </g>
</svg>
